name: Terraform AKS Infrastructure

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"

jobs:

  # ============================================================
  # 1. TERRAFORM INIT
  # ============================================================
  terraform-init:

    name: Terraform Init

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Azure login using OIDC
      # --------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------------------
      # Install Terraform
      # --------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # --------------------------------------------------------
      # Configure Azure authentication for Terraform
      # --------------------------------------------------------
      - name: Configure Terraform Azure authentication
        shell: bash
        run: |
          echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> "$GITHUB_ENV"
          echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> "$GITHUB_ENV"

      # --------------------------------------------------------
      # Terraform formatting check
      # --------------------------------------------------------
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # --------------------------------------------------------
      # Create backend configuration
      # --------------------------------------------------------
      - name: Create backend configuration
        shell: bash
        run: |
          cat > backend.hcl <<EOF
          resource_group_name  = "${{ vars.TF_STATE_RESOURCE_GROUP }}"
          storage_account_name = "${{ vars.TF_STATE_STORAGE_ACCOUNT }}"
          container_name       = "${{ vars.TF_STATE_CONTAINER }}"
          key                  = "${{ vars.TF_STATE_KEY }}"

          use_azuread_auth = true
          use_oidc         = true

          subscription_id = "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          tenant_id       = "${{ secrets.AZURE_TENANT_ID }}"
          client_id       = "${{ secrets.AZURE_CLIENT_ID }}"
          EOF

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------
      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -backend-config=backend.hcl


  # ============================================================
  # 2. TERRAFORM PLAN
  #
  # The GitHub Environment provides Approval #1
  # ============================================================
  terraform-plan:

    name: Terraform Plan

    needs:
      - terraform-init

    runs-on: ubuntu-latest

    environment:
      name: terraform-plan-approval

    steps:

      # --------------------------------------------------------
      # Checkout the exact commit that was merged
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Azure login
      # --------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # --------------------------------------------------------
      # Configure Terraform authentication
      # --------------------------------------------------------
      - name: Configure Terraform Azure authentication
        shell: bash
        run: |
          echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> "$GITHUB_ENV"
          echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> "$GITHUB_ENV"

         
      # --------------------------------------------------------
      # Backend configuration
      # --------------------------------------------------------
      - name: Create backend configuration
        shell: bash
        run: |
          cat > backend.hcl <<EOF
          resource_group_name  = "${{ vars.TF_STATE_RESOURCE_GROUP }}"
          storage_account_name = "${{ vars.TF_STATE_STORAGE_ACCOUNT }}"
          container_name       = "${{ vars.TF_STATE_CONTAINER }}"
          key                  = "${{ vars.TF_STATE_KEY }}"

          use_azuread_auth = true
          use_oidc         = true

          subscription_id = "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          tenant_id       = "${{ secrets.AZURE_TENANT_ID }}"
          client_id       = "${{ secrets.AZURE_CLIENT_ID }}"
          EOF

      # --------------------------------------------------------
      # Terraform Init
      #
      # Required because every GitHub Actions job starts
      # on a fresh runner.
      # --------------------------------------------------------
      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -backend-config=backend.hcl

      # --------------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------------
      - name: Terraform Validate
        run: terraform validate

      # --------------------------------------------------------
      # Terraform Plan
      #
      # IMPORTANT:
      # Do NOT pass location, RG, cluster name, node count, etc.
      # using -var here.
      #
      # Terraform will therefore use terraform.tfvars.
      # --------------------------------------------------------
      - name: Terraform Plan
        run: |
          terraform plan \
            -input=false \
            -out=tfplan

      # --------------------------------------------------------
      # Convert plan to human-readable output
      # --------------------------------------------------------
      - name: Create readable Terraform plan
        run: |
          terraform show \
            -no-color \
            tfplan > tfplan.txt

      # --------------------------------------------------------
      # Upload plan for review
      # --------------------------------------------------------
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            tfplan
            tfplan.txt
          retention-days: 7


  # ============================================================
  # 3. TERRAFORM APPLY
  #
  # The GitHub Environment provides Approval #2
  # ============================================================
  terraform-apply:

    name: Terraform Apply

    needs:
      - terraform-plan

    runs-on: ubuntu-latest

    environment:
      name: terraform-apply-approval

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Azure login
      # --------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # --------------------------------------------------------
      # Configure Terraform authentication
      # --------------------------------------------------------
      - name: Configure Terraform Azure authentication
        shell: bash
        run: |
          echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> "$GITHUB_ENV"
          echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> "$GITHUB_ENV"

       
      # --------------------------------------------------------
      # Backend configuration
      # --------------------------------------------------------
      - name: Create backend configuration
        shell: bash
        run: |
          cat > backend.hcl <<EOF
          resource_group_name  = "${{ vars.TF_STATE_RESOURCE_GROUP }}"
          storage_account_name = "${{ vars.TF_STATE_STORAGE_ACCOUNT }}"
          container_name       = "${{ vars.TF_STATE_CONTAINER }}"
          key                  = "${{ vars.TF_STATE_KEY }}"

          use_azuread_auth = true
          use_oidc         = true

          subscription_id = "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          tenant_id       = "${{ secrets.AZURE_TENANT_ID }}"
          client_id       = "${{ secrets.AZURE_CLIENT_ID }}"
          EOF

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------
      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -backend-config=backend.hcl

      # --------------------------------------------------------
      # Download the EXACT plan generated by the Plan job
      # --------------------------------------------------------
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan

      # --------------------------------------------------------
      # Apply the reviewed plan
      # --------------------------------------------------------
      - name: Terraform Apply
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

      # --------------------------------------------------------
      # Show Terraform outputs
      # --------------------------------------------------------
      - name: Terraform Outputs
        run: |
          terraform output