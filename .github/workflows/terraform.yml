# Terraform CI/CD for aks-infra
# PR  → plan
# main → apply
#
# OIDC only — no Azure client secrets / passwords on GitHub.
# Set repository Variables (Settings → Actions → Variables):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#   TF_STATE_*, optional TF_VAR_*

name: Terraform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"

jobs:
  terraform:
    name: Plan / Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Azure OIDC IDs
        id: azure
        env:
          VAR_CLIENT: ${{ vars.AZURE_CLIENT_ID }}
          VAR_TENANT: ${{ vars.AZURE_TENANT_ID }}
          VAR_SUB: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          SEC_CLIENT: ${{ secrets.AZURE_CLIENT_ID }}
          SEC_TENANT: ${{ secrets.AZURE_TENANT_ID }}
          SEC_SUB: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          CLIENT_ID="${VAR_CLIENT:-$SEC_CLIENT}"
          TENANT_ID="${VAR_TENANT:-$SEC_TENANT}"
          SUBSCRIPTION_ID="${VAR_SUB:-$SEC_SUB}"
          if [ -z "$CLIENT_ID" ] || [ -z "$TENANT_ID" ] || [ -z "$SUBSCRIPTION_ID" ]; then
            echo "::error::Missing AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID."
            echo "::error::Add them under Settings → Secrets and variables → Actions → Variables (preferred) or Secrets."
            echo "::error::Do NOT create an Azure client secret — OIDC federated credentials only."
            exit 1
          fi
          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "tenant_id=$TENANT_ID" >> "$GITHUB_OUTPUT"
          echo "subscription_id=$SUBSCRIPTION_ID" >> "$GITHUB_OUTPUT"

      - name: Azure Login (OIDC — no client secret)
        uses: azure/login@v3
        with:
          client-id: ${{ steps.azure.outputs.client_id }}
          tenant-id: ${{ steps.azure.outputs.tenant_id }}
          subscription-id: ${{ steps.azure.outputs.subscription_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Export ARM / TF env for Terraform
        run: |
          echo "ARM_CLIENT_ID=${{ steps.azure.outputs.client_id }}" >> "$GITHUB_ENV"
          echo "ARM_TENANT_ID=${{ steps.azure.outputs.tenant_id }}" >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=${{ steps.azure.outputs.subscription_id }}" >> "$GITHUB_ENV"
          echo "TF_VAR_subscription_id=${{ steps.azure.outputs.subscription_id }}" >> "$GITHUB_ENV"
          echo "ARM_USE_OIDC=true" >> "$GITHUB_ENV"
          echo "ARM_USE_AZUREAD=true" >> "$GITHUB_ENV"

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        run: |
          STATE_RG="${{ vars.TF_STATE_RESOURCE_GROUP }}"
          STATE_SA="${{ vars.TF_STATE_STORAGE_ACCOUNT }}"
          STATE_CONTAINER="${{ vars.TF_STATE_CONTAINER }}"
          STATE_KEY="${{ vars.TF_STATE_KEY }}"

          # Fall back to bootstrap defaults if repo variables are not yet configured
          STATE_RG="${STATE_RG:-rg-tfstate}"
          STATE_SA="${STATE_SA:-sttfstate1akc4957}"
          STATE_CONTAINER="${STATE_CONTAINER:-tfstate}"
          STATE_KEY="${STATE_KEY:-aks-infra.tfstate}"

          cat <<EOF > backend.hcl
resource_group_name  = "$STATE_RG"
storage_account_name = "$STATE_SA"
container_name       = "$STATE_CONTAINER"
key                  = "$STATE_KEY"
use_azuread_auth     = true
use_oidc             = true
subscription_id      = "${{ steps.azure.outputs.subscription_id }}"
tenant_id            = "${{ steps.azure.outputs.tenant_id }}"
client_id            = "${{ steps.azure.outputs.client_id }}"
EOF

          echo "Generated backend.hcl:"
          cat backend.hcl

          if ! terraform init -input=false -reconfigure -backend-config=backend.hcl 2>&1 | tee /tmp/init.log; then
            INIT_ERR=$(cat /tmp/init.log | tr '\r\n' ' ' | head -c 3000)
            echo "::error title=Terraform Init Failed::$INIT_ERR"
            exit 1
          fi

      - name: Terraform Validate
        run: |
          if ! terraform validate 2>&1 | tee /tmp/validate.log; then
            VAL_ERR=$(cat /tmp/validate.log | tr '\r\n' ' ' | head -c 3000)
            echo "::error title=Terraform Validate Failed::$VAL_ERR"
            exit 1
          fi

      - name: Terraform Plan
        id: plan
        run: |
          EXTRA_VARS=(-var="subscription_id=${{ steps.azure.outputs.subscription_id }}")
          if [ -n "${{ vars.TF_VAR_location }}" ]; then
            EXTRA_VARS+=(-var="location=${{ vars.TF_VAR_location }}")
          fi
          if [ -n "${{ vars.TF_VAR_resource_group_name }}" ]; then
            EXTRA_VARS+=(-var="resource_group_name=${{ vars.TF_VAR_resource_group_name }}")
          fi
          if [ -n "${{ vars.TF_VAR_cluster_name }}" ]; then
            EXTRA_VARS+=(-var="cluster_name=${{ vars.TF_VAR_cluster_name }}")
          fi
          if [ -n "${{ vars.TF_VAR_node_count }}" ]; then
            EXTRA_VARS+=(-var="node_count=${{ vars.TF_VAR_node_count }}")
          fi
          if [ -n "${{ vars.TF_VAR_node_vm_size }}" ]; then
            EXTRA_VARS+=(-var="node_vm_size=${{ vars.TF_VAR_node_vm_size }}")
          fi
          if [ -n "${{ vars.TF_VAR_os_disk_size_gb }}" ]; then
            EXTRA_VARS+=(-var="os_disk_size_gb=${{ vars.TF_VAR_os_disk_size_gb }}")
          fi

          if ! terraform plan -input=false -out=tfplan "${EXTRA_VARS[@]}" 2>&1 | tee /tmp/plan.log; then
            PLAN_ERR=$(cat /tmp/plan.log | tr '\r\n' ' ' | sed 's/::/ - /g' | head -c 1000)
            echo "::error::$PLAN_ERR"
            exit 1
          fi
          terraform show -no-color tfplan > tfplan.txt

      - name: Upload plan debug log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plan-failure-log
          path: /tmp/plan.log

      - name: Post failure log to commit comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '### Diagnostic Log\n';
            if (fs.existsSync('/tmp/init.log')) {
              body += '#### Init Log\n```text\n' + fs.readFileSync('/tmp/init.log', 'utf8').substring(0, 10000) + '\n```\n';
            }
            if (fs.existsSync('/tmp/validate.log')) {
              body += '#### Validate Log\n```text\n' + fs.readFileSync('/tmp/validate.log', 'utf8').substring(0, 5000) + '\n```\n';
            }
            if (fs.existsSync('/tmp/plan.log')) {
              body += '#### Plan Log\n```text\n' + fs.readFileSync('/tmp/plan.log', 'utf8').substring(0, 20000) + '\n```\n';
            }
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body
            });

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            tfplan
            tfplan.txt
          retention-days: 7

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('tfplan.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n\n… truncated …'
              : plan;
            const body = `#### Terraform plan\n\`\`\`\n${truncated}\n\`\`\`\n*Pusher: @${{ github.actor }}* | *Workflow: \`${{ github.workflow }}\`*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: terraform apply -input=false -auto-approve tfplan

      - name: Print useful outputs
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          echo "=== Set these on sample-app GitHub Variables ==="
          echo "ACR_NAME=$(terraform output -raw acr_name)"
          echo "AKS_RESOURCE_GROUP=$(terraform output -raw resource_group_name)"
          echo "AKS_CLUSTER_NAME=$(terraform output -raw cluster_name)"
          echo "ACR_LOGIN_SERVER=$(terraform output -raw acr_login_server)"
