# Terraform CI/CD for aks-infra
# PR  → plan
# main → apply
#
# Secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# Variables (or secrets): TF_STATE_*, TF_VAR_location, TF_VAR_resource_group_name,
#   TF_VAR_cluster_name, TF_VAR_node_count, TF_VAR_node_vm_size (optional overrides)

name: Terraform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  # Terraform variables (subscription required; rest have defaults in variables.tf)
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  terraform:
    name: Plan / Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          EXTRA_VARS=()
          if [ -n "${{ vars.TF_VAR_location }}" ]; then
            EXTRA_VARS+=(-var="location=${{ vars.TF_VAR_location }}")
          fi
          if [ -n "${{ vars.TF_VAR_resource_group_name }}" ]; then
            EXTRA_VARS+=(-var="resource_group_name=${{ vars.TF_VAR_resource_group_name }}")
          fi
          if [ -n "${{ vars.TF_VAR_cluster_name }}" ]; then
            EXTRA_VARS+=(-var="cluster_name=${{ vars.TF_VAR_cluster_name }}")
          fi
          if [ -n "${{ vars.TF_VAR_node_count }}" ]; then
            EXTRA_VARS+=(-var="node_count=${{ vars.TF_VAR_node_count }}")
          fi
          if [ -n "${{ vars.TF_VAR_node_vm_size }}" ]; then
            EXTRA_VARS+=(-var="node_vm_size=${{ vars.TF_VAR_node_vm_size }}")
          fi
          terraform plan -input=false -out=tfplan "${EXTRA_VARS[@]}"
          terraform show -no-color tfplan > tfplan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            tfplan
            tfplan.txt
          retention-days: 7

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('tfplan.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n\n… truncated …'
              : plan;
            const body = `#### Terraform plan\n\`\`\`\n${truncated}\n\`\`\`\n*Pusher: @${{ github.actor }}* | *Workflow: \`${{ github.workflow }}\`*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: terraform apply -input=false -auto-approve tfplan

      - name: Print useful outputs
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          echo "=== Set these on sample-app GitHub Variables ==="
          echo "ACR_NAME=$(terraform output -raw acr_name)"
          echo "AKS_RESOURCE_GROUP=$(terraform output -raw resource_group_name)"
          echo "AKS_CLUSTER_NAME=$(terraform output -raw cluster_name)"
          echo "ACR_LOGIN_SERVER=$(terraform output -raw acr_login_server)"
