name: Terraform Azure Infrastructure

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: "Terraform environment to deploy"
        required: true
        type: choice
        options:
          - ci01
          - ci02
          - prod
        default: ci01

permissions:
  id-token: write
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"

  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  TF_VERSION: "1.9.8"

jobs:

  # ============================================================
  # 1. SELECT ENVIRONMENT
  # ============================================================
  prepare:
    name: Select Terraform Environment
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.env.outputs.environment }}
      tfvars_file: ${{ steps.env.outputs.tfvars_file }}
      state_key: ${{ steps.env.outputs.state_key }}

    steps:
      - name: Determine environment
        id: env
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENVIRONMENT="${{ inputs.environment }}"
          else
            ENVIRONMENT="ci01"
          fi

          case "$ENVIRONMENT" in
            ci01)
              TFVARS_FILE="environments/ci01/terraform.tfvars"
              STATE_KEY="ci01.tfstate"
              ;;

            ci02)
              TFVARS_FILE="environments/ci02/terraform.tfvars"
              STATE_KEY="ci02.tfstate"
              ;;

            prod)
              TFVARS_FILE="environments/prod/terraform.tfvars"
              STATE_KEY="prod.tfstate"
              ;;

            *)
              echo "ERROR: Unsupported environment: $ENVIRONMENT"
              exit 1
              ;;
          esac

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "tfvars_file=$TFVARS_FILE" >> "$GITHUB_OUTPUT"
          echo "state_key=$STATE_KEY" >> "$GITHUB_OUTPUT"

          echo "Environment : $ENVIRONMENT"
          echo "TF vars     : $TFVARS_FILE"
          echo "State key   : $STATE_KEY"


  # ============================================================
  # 2. TERRAFORM INIT + VALIDATE
  # ============================================================
  terraform-init:
    name: Terraform Init and Validate

    needs:
      - prepare

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Create backend configuration
        shell: bash
        run: |
          set -euo pipefail

          cat > backend.hcl <<EOF
          resource_group_name  = "${{ vars.TF_STATE_RESOURCE_GROUP }}"
          storage_account_name = "${{ vars.TF_STATE_STORAGE_ACCOUNT }}"
          container_name       = "${{ vars.TF_STATE_CONTAINER }}"
          key                  = "${{ needs.prepare.outputs.state_key }}"

          use_azuread_auth = true
          use_oidc         = true

          subscription_id = "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          tenant_id       = "${{ vars.AZURE_TENANT_ID }}"
          client_id       = "${{ vars.AZURE_CLIENT_ID }}"
          EOF

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -backend-config=backend.hcl

      - name: Terraform Validate
        run: terraform validate


  # ============================================================
  # 3. APPROVAL + TERRAFORM PLAN
  # ============================================================
  terraform-plan:
    name: Terraform Plan

    needs:
      - prepare
      - terraform-init

    runs-on: ubuntu-latest

    environment:
      name: terraform-plan-approval

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Create backend configuration
        shell: bash
        run: |
          set -euo pipefail

          cat > backend.hcl <<EOF
          resource_group_name  = "${{ vars.TF_STATE_RESOURCE_GROUP }}"
          storage_account_name = "${{ vars.TF_STATE_STORAGE_ACCOUNT }}"
          container_name       = "${{ vars.TF_STATE_CONTAINER }}"
          key                  = "${{ needs.prepare.outputs.state_key }}"

          use_azuread_auth = true
          use_oidc         = true

          subscription_id = "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          tenant_id       = "${{ vars.AZURE_TENANT_ID }}"
          client_id       = "${{ vars.AZURE_CLIENT_ID }}"
          EOF

      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -backend-config=backend.hcl

      - name: Verify Terraform variables file
        run: |
          test -f "${{ needs.prepare.outputs.tfvars_file }}" || {
            echo "ERROR: Terraform variables file does not exist:"
            echo "${{ needs.prepare.outputs.tfvars_file }}"
            exit 1
          }

          echo "Using Terraform variables:"
          echo "${{ needs.prepare.outputs.tfvars_file }}"

      - name: Terraform Plan
        run: |
          terraform plan \
            -input=false \
            -var-file="${{ needs.prepare.outputs.tfvars_file }}" \
            -out=tfplan

      - name: Export readable Terraform plan
        run: |
          terraform show \
            -no-color \
            tfplan > tfplan.txt

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ needs.prepare.outputs.environment }}
          path: |
            tfplan
            tfplan.txt
          retention-days: 7


  # ============================================================
  # 4. PLAN REVIEW / APPROVAL + TERRAFORM APPLY
  # ============================================================
  terraform-apply:
    name: Terraform Apply

    needs:
      - prepare
      - terraform-plan

    runs-on: ubuntu-latest

    environment:
      name: terraform-apply-approval

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Create backend configuration
        shell: bash
        run: |
          set -euo pipefail

          cat > backend.hcl <<EOF
          resource_group_name  = "${{ vars.TF_STATE_RESOURCE_GROUP }}"
          storage_account_name = "${{ vars.TF_STATE_STORAGE_ACCOUNT }}"
          container_name       = "${{ vars.TF_STATE_CONTAINER }}"
          key                  = "${{ needs.prepare.outputs.state_key }}"

          use_azuread_auth = true
          use_oidc         = true

          subscription_id = "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          tenant_id       = "${{ vars.AZURE_TENANT_ID }}"
          client_id       = "${{ vars.AZURE_CLIENT_ID }}"
          EOF

      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -backend-config=backend.hcl

      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ needs.prepare.outputs.environment }}
          path: .

      - name: Display Terraform plan
        run: |
          echo "============================================"
          echo "Environment: ${{ needs.prepare.outputs.environment }}"
          echo "State key:   ${{ needs.prepare.outputs.state_key }}"
          echo "============================================"

          cat tfplan.txt

      - name: Terraform Apply
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

      - name: Terraform Outputs
        run: |
          terraform output
